<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com google fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Faster+One&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap');

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            color: white;
            background-color: black;
        }

        h1 {
            font: lighter 2em 'Faster One';
        }
        p{
            font-family: "caveat";
            font-size: 1.5em;
        }
    </style>
</head>

<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Necessitatibus sed officiis, eum consequuntur incidunt
        expedita a nulla amet architecto voluptatibus excepturi ab natus nostrum minus, laborum perferendis dicta vero
        hic.</p>
</body>

</html>
