<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url('fonts/love story ttf.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
             /* Tipos de formatos:  
            -Opentype (otf)
            -TrueType (ttf)
            -Embedded-Opentype
            -TrueType-aat (apple advanced typography)
            -svg*/
        }

       
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family: 'Love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Porro alias et cupiditate illum a. Culpa dicta natus architecto, a laudantium aliquam voluptatem non qui repellat id in illum harum? Optio.</p>
</body>
</html>
