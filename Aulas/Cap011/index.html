<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou aumente diminue o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/pequena.png"  type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/media.png" type="image/png">
        <img src="imagens/Grande.png" alt="Imagem Flexível">
    </picture>

    <h1>Reproduzindo audio</h1>
    <audio preload="metadata" autoplay controls>
        <source src="midia/good for the ghost - Alge.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
