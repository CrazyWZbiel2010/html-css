<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        *{
            margin: 0px 10px;
            padding: 0;
        }
        h1{
            height: 100px;
            background: linear-gradient(green, rgba(0, 104, 0, 0.651));
            text-align: center;
            padding-top: 50px;
            border-radius: 10px;
            box-shadow: 10px 10px 20px;
            margin-bottom: 20px;

            outline: 10px dashed salmon;
        }
        body{
            background-color: rgb(0, 255, 0);
        }
        a{
            /*border-width: 2px;
            border-style: dashed;
            border-color: red;*/ 

            border: 2px dashed red;
            margin: 10px 10px 10px;
        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box level</h1>
    <p>Parágrafos também são exemplos de box level, mas os <strong><a href="#">links são exemplos de caixa inline level</a></strong>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
