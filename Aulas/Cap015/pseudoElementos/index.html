<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Elementos</title>
    <style>

        /* 
        id = #
        class = .
        pseudo-class = :
        pseudo-element = ::
        children = >
        */

        a{
            color: black;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: red;
        }
        a:hover{
            text-decoration: underline;
            color: blue;
        }
        a:active{
            color: black;
        }
        a::after{
            content: '[link]';
            color: darkgray;
            font-weight: normal;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/CrazyWZbiel2010" target="_blank">Github</a></li>
        <li><a href="https://www.instagram.com/gabrieldonato303/" target="_blank">Instagram</a></li>
        <li><a href="https://wa.me/5519995434401" target="_blank">Whatszap</a></li>
    </ul>
</body>
</html>
